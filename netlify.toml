[build]
  command = "bun run build"
  publish = "dist/client"

[build.environment]
  BUN_VERSION = "1.4.2"

[dev]
  command = "bun run dev"
  port = 3000
  targetPort = 3000

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
from = "/ingest/*"
to = "https://us.i.posthog.com/:splat"
status = 200
force = true
host = "us.i.posthog.com"
